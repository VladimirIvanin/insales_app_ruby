name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build from a developer checkout with local markers
        run: |
          mkdir -p .agents .codex .cursor tmp/ci
          for directory in .agents .codex .cursor; do
            echo synthetic-local-tooling > "$directory/context-marker"
          done
          docker build -t insales-app-ruby . 2>&1 | tee tmp/ci/build.log
      - name: Test, lint and static analysis
        run: docker run --name app-check -e RAILS_ENV=test insales-app-ruby bin/check --skip-audit
      - name: Collect test results and seed
        if: always()
        run: |
          docker cp app-check:/app/tmp/check tmp/ci/rspec || true
          docker logs app-check > tmp/ci/check.log 2>&1 || true
          docker cp app-check:/app/log/test.log tmp/ci/rails-test.log || true
          docker rm -f app-check || true
      - name: Production image smoke and local context exclusion
        run: bin/check-image insales-app-ruby 2>&1 | tee tmp/ci/image-smoke.log
      - name: Save check logs (v7.0.2)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: check-logs
          path: tmp/ci
          retention-days: 14
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Ruby and locked dependencies
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Audit current advisory database
        run: bundle exec bundler-audit check --update 2>&1 | tee dependency-audit.log
      - name: Save audit log (v7.0.2)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-audit
          path: dependency-audit.log
          retention-days: 14
  image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build final image
        run: docker build -t insales-app-ruby:audit .
      - name: Scan final image OS and language packages (Trivy action 0.35.0)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.69.3
          image-ref: insales-app-ruby:audit
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy.json
          exit-code: '1'
      - name: Save image scan (v7.0.2)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-audit
          path: trivy.json
          retention-days: 14
