name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build
        run: docker build -t insales-app-ruby .
      - name: Test, lint and audit
        run: docker run --rm -e RAILS_ENV=test insales-app-ruby bin/check
